<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d1c">
  <meta name="description" content="Живая сплеш-анимация Asteria">
  <title>Asteria · Splash</title>
  <link rel="stylesheet" href="style.css?v=final-silk-20261118">
</head>
<body>
  <main>
    <div class="stage" role="img" aria-label="Сплеш Asteria: на шёлковом фоне появляются рельефный знак и рукописная надпись Asteria">
      <canvas id="silk" aria-hidden="true"></canvas>
      <img id="silk-poster" src="assets/silk-poster.png" alt="" aria-hidden="true">
      <video id="silk-video" src="assets/silk.mp4" muted playsinline loop preload="auto" aria-hidden="true" tabindex="-1"></video>
      <canvas id="art" aria-hidden="true"></canvas>
    </div>
    <div class="controls">
      <span class="brand">Asteria</span>
      <button id="replay" type="button" disabled>Повторить <span aria-hidden="true">↻</span></button>
    </div>
    <p id="status" role="status">Загрузка анимации…</p>
    <noscript>Для живой анимации включите JavaScript.</noscript>
  </main>
  <script type="module" src="splash.js?v=final-silk-20261118"></script>
</body>
</html>
